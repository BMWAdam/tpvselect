name: LOC Badge

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count LOC
        run: cloc --json . > cloc.json

      - name: Generate badge
        run: |
          TOTAL=$(jq '.SUM.code' cloc.json)
          cat > loc-badge.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="20" role="img" aria-label="LOC">
            <title>Lines of Code</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb"/>
              <stop offset="1" stop-color="#999"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="120" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="50" height="20" fill="#555"/>
              <rect x="50" width="70" height="20" fill="#4c1"/>
              <rect width="120" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
              <text x="26" y="15" fill="#010101" fill-opacity=".3">LOC</text>
              <text x="26" y="14">LOC</text>
              <text x="84" y="15" fill="#010101" fill-opacity=".3">$TOTAL</text>
              <text x="84" y="14">$TOTAL</text>
            </g>
          </svg>
          EOF

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: loc-badge
          path: loc-badge.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: badges

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: loc-badge

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p badges
          mv loc-badge.svg badges/
          git add badges/loc-badge.svg
          git commit -m "Update LOC badge" || exit 0
          git push
