name: LOC Badge

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count LOC
        run: cloc --json . > cloc.json

      - name: Generate badge
        run: |
          TOTAL=$(jq '.SUM.code' cloc.json)
          echo "<svg ...>$TOTAL</svg>" > loc-badge.svg

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: loc-badge
          path: loc-badge.svg

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: badges

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: loc-badge

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p badges
          mv loc-badge.svg badges/
          git add badges/loc-badge.svg
          git commit -m "Update LOC badge" || exit 0
          git push
