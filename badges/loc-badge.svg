<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="20" role="img" aria-label="LOC">
  <title>Lines of Code</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb"/>
    <stop offset="1" stop-color="#999"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="120" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="50" height="20" fill="#555"/>
    <rect x="50" width="70" height="20" fill="#4c1"/>
    <rect width="120" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
    <text x="26" y="15" fill="#010101" fill-opacity=".3">LOC</text>
    <text x="26" y="14">LOC</text>
    <text x="84" y="15" fill="#010101" fill-opacity=".3">$TOTAL</text>
    <text x="84" y="14">$TOTAL</text>
  </g>
</svg>
